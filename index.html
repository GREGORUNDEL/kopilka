<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Копилка</title>
<meta name="description" content="Учёт расходов и доходов с накоплениями на Японию.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Копилка">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: iOS tab-bar app, one column on phones; from 900px a left rail and wider content. Tokens from the «Копилка iOS» design system. */
:root{
  --surface:#F2F2F7; --surface-raised:#FFFFFF; --surface-sunken:#E6E6EB; --line:#D1D1D6;
  --ink:#1C1C1E; --ink-muted:#6C6C72; --ink-faint:#AEAEB2; --bud-d:#48484A; --bud-f:#AEAEB2; --hair:rgba(60,60,67,.18);
  --ai:#2F4A8A; --ai-soft:#E3E8F5; --on-ai:#FFFFFF;
  --shu:#C8442E; --shu-soft:#FBE7E3; --matsu:#2E7D4F; --matsu-soft:#E2F2E8; --kin:#B5761A;
  --series-1:#3D5DB5; --series-2:#B5761A; --inc:#3E9A6A; --exp:#D9A22E; --profit:#4F86D6; --loss:#D9603E;
  --scrim:rgba(0,0,0,.32); --nav:rgba(242,242,247,.88); --bar:rgba(255,255,255,.86); --bar-edge:rgba(255,255,255,.9); --bar-shadow:0 8px 28px rgba(20,24,40,.14),0 1px 3px rgba(20,24,40,.08);
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-rounded:ui-rounded,"SF Pro Rounded",-apple-system,"Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --r-sm:10px; --r-md:16px; --r-lg:24px;
  /* Apple HIG text styles, default size: large 34/41 · title1 28/34 · title2 22/28 · title3 20/25 · body 17/22 · callout 16/21 · subhead 15/20 · footnote 13/18 · caption1 12/16 · caption2 11/13 */
  --tabh:62px; --tabgap:max(calc(env(safe-area-inset-bottom,0px) - 12px),12px);
  --safe-top:env(safe-area-inset-top,0px); --top-gap:0px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --surface:#000000; --surface-raised:#1C1C1E; --surface-sunken:#2C2C2E; --line:#38383A;
  --ink:#F2F2F7; --ink-muted:#98989F; --ink-faint:#5A5A5F; --bud-d:#D1D1D6; --bud-f:#7C7C80; --hair:rgba(84,84,88,.6);
  --ai:#8FA8F0; --ai-soft:#1A2340; --on-ai:#0B1020;
  --shu:#FF7A5C; --shu-soft:#3A1710; --matsu:#5FCB8A; --matsu-soft:#0F2A1A; --kin:#D9A24A;
  --series-1:#6D8CF0; --series-2:#B98226; --inc:#5FBF8A; --exp:#E0B04A; --profit:#7FA6F0; --loss:#F07E5C;
  --scrim:rgba(0,0,0,.6); --nav:rgba(0,0,0,.84); --bar:rgba(36,36,40,.86); --bar-edge:rgba(255,255,255,.12); --bar-shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark }}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--surface);overscroll-behavior-x:none;overscroll-behavior-y:auto;min-height:100%;touch-action:pan-x pan-y}
/* no pinch or double-tap zoom: the app is laid out for the phone screen */
body,button,a,input,select,label{touch-action:manipulation}
/* Every page at least one screen tall: on iOS home-screen apps a short page makes the viewport shrink and the tab bar float */
body{min-height:calc(100vh + 1px);min-height:calc(100lvh + 1px)}
[hidden]{display:none!important}
/* Home-screen app on iOS: the system draws its own fade under the status bar (WebKit bug 301994 can also report a 0 inset), so keep content clear of it */
@media (display-mode: standalone){:root{--safe-top:max(env(safe-area-inset-top,0px),59px);--top-gap:6px}}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans);font-size:17px;line-height:22px;-webkit-font-smoothing:antialiased;
  padding-top:calc(var(--safe-top) + var(--top-gap));padding-bottom:calc(var(--tabh) + var(--tabgap) + 28px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:calc(var(--safe-top) + var(--top-gap));z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.pos-t{color:var(--matsu)} .neg-t{color:var(--shu)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* page frame */
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.top{position:relative;z-index:5;background:var(--surface);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ai);background:var(--surface-raised);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.icon-btn.fill{background:var(--ai);color:var(--on-ai)}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--ink-muted);padding:6px 8px;border-radius:999px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--ink-muted)}
.sync[data-s="ok"] i{background:var(--matsu)}
.sync[data-s="syncing"] i{background:var(--ai);animation:pulse 1s infinite}
.sync[data-s="offline"] i,.sync[data-s="local"] i{background:var(--kin)}
.sync[data-s="auth"] i,.sync[data-s="norepo"] i,.sync[data-s="error"] i{background:var(--shu)}
.sync[data-s="auth"],.sync[data-s="norepo"]{color:var(--shu)}
@keyframes pulse{50%{opacity:.3}}
h1.title{margin:4px 0 0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.02em}
h1.title.sm{font-size:28px;line-height:34px;margin:0;letter-spacing:-.01em}
.sticky{position:sticky;top:calc(var(--safe-top) + var(--top-gap));z-index:6;background:var(--surface);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:4px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
/* soft lower edge: content slides under the header and fades out instead of being cut by a line */
.sticky::after{content:"";position:absolute;left:0;right:0;top:100%;height:20px;pointer-events:none;
  background:linear-gradient(to bottom,var(--surface) 0%,color-mix(in srgb,var(--surface) 72%,transparent) 30%,color-mix(in srgb,var(--surface) 30%,transparent) 65%,color-mix(in srgb,var(--surface) 0%,transparent) 100%)}
.sticky-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ov-head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px}
.ov-head .acc-pick{margin:0}
.chart.hs{display:grid;grid-template-columns:38px minmax(0,1fr);margin-left:-6px}
.ch-scroll{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x pan-y}
.ch-scroll::-webkit-scrollbar{display:none}
.ch-inner{position:relative}
.chart .ch-inner svg,.chart .ch-axis svg{width:auto;max-width:none;height:auto}
#kHero{order:1}#kSeg{order:2}#kSchools{order:3}#kPlan{order:3}#kPathC{order:4}#kBarsC{order:5}#kRateC{order:6}#kWeeks{order:7}#kChanges{order:8}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hanko{flex:none;width:40px;height:40px;border-radius:8px;border:2px solid var(--shu);color:var(--shu);display:grid;place-items:center;font-size:22px;line-height:1;font-weight:700;transform:rotate(-4deg)}
.sub{color:var(--ink-muted);font-size:15px;line-height:20px}

/* tab bar: floating glass capsule, as in iOS 26 */
.tabbar{position:fixed;z-index:15;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:var(--tabgap);
  max-width:400px;margin:0 auto;height:var(--tabh);padding:4px;border-radius:999px;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:var(--bar-shadow),inset 0 0 0 .5px var(--bar-edge)}
.tabbar-in{display:grid;grid-template-columns:repeat(4,1fr);height:100%}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;line-height:12px;font-weight:600;color:var(--ink);border-radius:999px;transition:background .2s,color .2s}
.tab svg.i{width:24px;height:24px;stroke-width:1.9}
.tab[aria-current="page"]{color:var(--ai);background:var(--ai-soft)}
.tab .kanji{font-size:20px;line-height:24px;font-weight:700;height:24px}
.fab{position:fixed;z-index:14;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + var(--tabgap) + 16px);
  width:56px;height:56px;border-radius:50%;background:var(--ai);color:var(--on-ai);display:grid;place-items:center;box-shadow:0 6px 20px rgba(20,30,60,.3)}
.fab svg.i{width:26px;height:26px;stroke-width:2.4}
.fab.away{transform:translateY(calc(100% + var(--tabh) + var(--tabgap) + 24px))!important;opacity:0;pointer-events:none}
#fab{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.seg-hit{cursor:pointer;-webkit-tap-highlight-color:transparent}
.ring-cover{pointer-events:none}
#ptr{position:fixed;left:50%;top:calc(var(--safe-top) + 4px);z-index:45;transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  background:var(--surface-raised);color:var(--ink-muted);font-size:13px;line-height:18px;padding:6px 12px;border-radius:14px;white-space:nowrap}

/* cards and lists */
.card{background:var(--surface-raised);border-radius:var(--r-md);padding:16px}
.section-label{font-size:13px;line-height:18px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em;margin:0 16px 8px;display:flex;justify-content:space-between;gap:12px}
.section-label .num{text-transform:none;letter-spacing:0}
.group{display:flex;flex-direction:column}
.list{background:var(--surface-raised);border-radius:var(--r-md);overflow:hidden}
.row{display:flex;width:100%;align-items:center;gap:12px;padding:10px 16px;text-align:left;position:relative;min-height:60px}
.row+.row::before{content:"";position:absolute;left:64px;right:0;top:0;border-top:.5px solid var(--hair)}
.list.flat .row{min-height:48px}
.list.flat .row+.row::before{left:16px}
.row:active{background:var(--surface-sunken)}
.row .mid{flex:1;min-width:0}
.row .t{font-size:17px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:15px;line-height:20px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{flex:none;font-weight:600;font-size:17px;line-height:22px;text-align:right;letter-spacing:-.01em}
.row .amt small{display:block;font-weight:400;font-size:13px;line-height:18px;color:var(--ink-muted);letter-spacing:0}
.row .val{flex:none;font-size:17px;color:var(--ink-muted)}
.row>svg.i:last-child{width:18px;height:18px;stroke-width:2.2;color:var(--ink-faint);margin-right:-4px}
.ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ic svg.i{width:20px;height:20px;stroke-width:2}
.ic.lg{width:56px;height:56px}.ic.lg svg.i{width:28px;height:28px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 6px;font-size:11px;line-height:16px;font-weight:600;background:var(--surface-sunken);color:var(--ink-muted);vertical-align:2px}
.chip.kin{background:color-mix(in srgb,var(--kin) 16%,transparent);color:var(--kin)}
.tagline{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-muted);font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.banner{background:var(--shu-soft);color:var(--ink);border-radius:var(--r-md);padding:12px 16px;font-size:15px;line-height:20px}
.btn{display:block;width:100%;border-radius:14px;padding:14px 16px;min-height:50px;font-size:17px;line-height:22px;font-weight:600;text-align:center;background:var(--ai);color:var(--on-ai)}
.btn.plain{background:var(--surface-raised);color:var(--ai);font-weight:600}
.btn.small{min-height:0;padding:10px 16px;font-size:15px;line-height:20px;background:var(--ai-soft)}
.btn.danger{background:var(--surface-raised);color:var(--shu);font-weight:600}
.btn.danger.confirm{background:var(--shu);color:#fff}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:var(--r-md);background:var(--surface-raised);color:var(--ai);font-size:15px;line-height:20px;font-weight:600}
.qbtn svg.i{width:24px;height:24px}

/* segmented + period */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-sunken);border-radius:10px;padding:2px;gap:2px}
.seg button{border-radius:8px;padding:7px 4px;min-height:32px;font-size:13px;line-height:18px;font-weight:500;color:var(--ink);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-raised);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg button span{display:block;font-weight:400;color:var(--ink-muted);font-size:12px}
.range{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;min-height:52px}
.range.custom{justify-content:center}
.rmid{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.pkind{position:relative;display:inline-flex;align-items:center;font-size:13px;line-height:18px;font-weight:600;color:var(--ai);padding:2px 8px;border-radius:8px;cursor:pointer}
.pkind span{display:inline-flex;align-items:center;gap:2px}
.pkind svg.i{width:14px;height:14px;stroke-width:2.6}
.pkind select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer;-webkit-appearance:none;appearance:none}
.range button.nav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ai)}
.range button.nav:disabled{color:var(--ink-faint)}
.range .lbl{font-size:17px;line-height:22px;font-weight:600;text-align:center}
.custom-range{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px;font-size:15px}
.custom-range input{border:1px solid var(--line);border-radius:8px;background:var(--surface-raised);padding:6px 8px;font-size:16px}
.acc-pick{display:flex;flex-direction:column;align-items:center;gap:0;margin:2px auto 0}
.acc-pick button{display:flex;align-items:center;gap:4px;color:var(--ink-muted);font-size:15px;line-height:20px;padding:2px 8px;border-radius:8px}
.acc-pick button svg.i{width:16px;height:16px;stroke-width:2.4}
.acc-pick.tap{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
.acc-pick.tap:active{opacity:.55}
.acc-pick.tap .big{display:block}
.acc-sel{display:flex;align-items:center;gap:4px;color:var(--ink-muted);font-size:15px;line-height:20px}
.acc-sel svg.i{width:16px;height:16px;stroke-width:2.4}
.acc-pick .big{font-family:var(--font-rounded);font-size:40px;line-height:46px;font-weight:700;letter-spacing:-.02em}
.acc-pick .big small{font-size:22px;color:var(--ink-muted);font-weight:600;margin-left:4px}

/* overview */
.ov-stats{display:flex;flex-direction:column}
.ov-top{display:flex;gap:8px;align-items:center}
.ov-top .seg{flex:1}
.view-btn{width:36px;height:36px;background:var(--surface-sunken);box-shadow:none}
.view-btn svg.i{width:20px;height:20px}
.ov-sum{text-align:center;font-size:15px;line-height:20px;color:var(--ink-muted);margin-top:4px}
.ov-sum b{color:var(--ink);font-weight:600}
.ov-stats .range{margin-top:8px}
.donut-wrap{position:relative;width:min(210px,58vw);margin:8px auto 0}
.donut-wrap svg{display:block;width:100%;height:auto}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-c b{font-family:var(--font-rounded);font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.01em}
.donut-c span{font-size:13px;line-height:18px;color:var(--ink-muted)}
.donut-c b [data-roll]{font:inherit;color:inherit}
.cat-row .bar{height:4px;border-radius:2px;background:var(--surface-sunken);margin-top:5px;overflow:hidden}
.cat-row .bar i{display:block;height:100%;border-radius:2px}
.avg-top{padding:12px 16px 4px}
.avg-row{min-height:52px;cursor:default}
.page .avg-row:active{background:none;transform:none}
.avg-row .bar{height:4px;border-radius:2px;background:var(--surface-sunken);margin-top:6px;overflow:hidden}
.avg-row .bar i{display:block;height:100%;border-radius:2px}
.avg-row .amt{font-weight:600;min-width:96px;text-align:right}
.avg-row.total .t{font-weight:600}
.avg-row.total .s{font-size:13px;line-height:18px;color:var(--ink-muted)}
.avg-row .s.wrap{display:block;white-space:normal;overflow:visible;text-overflow:clip}
.avg-row .s span[data-avg]{display:inline}
.plan .avg-row{min-height:60px}
.avg-note{text-align:center;margin:8px 16px 0}
#ovAvg{margin-top:8px}
/* motion: ring sweep, press feedback (Home for now) */
.ring-cover{stroke-dashoffset:0;animation:ring-sweep .75s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes ring-sweep{to{stroke-dashoffset:-314.16px;visibility:hidden}}
.page :is(.row,.b-head,.goal-line,.ctag,.icon-btn,.seg button,.acc-pick.tap,.qbtn,.btn,.card.school),#fab,.tab,.sheet :is(.cat-btn,.dchip,.opt,.tag,.keypad button){transition:transform .18s cubic-bezier(.2,.8,.2,1),opacity .18s}
.page :is(.row,.b-head,.ctag,.btn):active{transform:scale(.985)}
.page :is(.qbtn):active{transform:scale(.96)}
.page :is(.icon-btn,.seg button):active,#fab:active,.tab:active,.sheet :is(.cat-btn,.dchip,.opt,.tag):active{transform:scale(.92)}
.sheet .keypad button:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){.ring-cover{display:none}.page :active,#fab:active,.tab:active,.sheet :active{transform:none!important}}
.cat-row .pct{flex:none;width:44px;text-align:right;font-size:15px;color:var(--ink-muted)}
.cat-sub{padding:0 16px 8px 64px;display:flex;flex-direction:column;gap:0;font-size:15px;line-height:20px}
.cat-sub .ctag{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:0;border:0;background:none;font:inherit;color:var(--ink-muted);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cat-sub .ctag span:first-child{flex:1;color:var(--ink)}
.cat-sub .ctag svg.i{width:16px;height:16px;color:var(--ink-faint,var(--ink-muted));opacity:.6}
.cat-sub .ctag:active{opacity:.55}
.ov-grid{display:flex;flex-direction:column;gap:24px}
/* goal progress under the total */
.goal-line{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:340px;margin:2px auto 0;padding:2px 0}
.gbar{display:block;width:100%;height:6px;border-radius:3px;background:var(--surface-sunken);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;background:var(--series-2)}
.gtxt{font-size:13px;line-height:18px;color:var(--ink-muted)}
.gtxt b{color:var(--ink);font-weight:600}
.veil{filter:blur(9px);-webkit-user-select:none;user-select:none;pointer-events:none}
.acc-pick .big.veil{filter:blur(14px)}
/* hidden balance: one switch (body.hide-bal) blurs only the figures themselves (.vn / amounts), never labels or names */
